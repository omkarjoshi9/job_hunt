name: pipeline
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: jobdigest-pipeline
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.gate.outputs.due }}
      slot: ${{ steps.gate.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Schedule gate
        env:
          PYTHONPATH: src
          JOBDIGEST_CRON: ${{ secrets.JOBDIGEST_CRON }}
          JOBDIGEST_CRON_URGENT: ${{ secrets.JOBDIGEST_CRON_URGENT }}
        run: python3 -m jobdigest.cron
  pipeline:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Used only when the DATABASE_URL secret is empty. Keeps "already sent" state
      # between runs (via the Actions cache below) so the digest never repeats itself.
      DATABASE_PATH: data/pipeline_state.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: pip install -e ".[marketplaces]"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.62.0
      - name: Install Chromium system deps
        run: python -m playwright install-deps chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - name: Write private config
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          COMPANIES_YAML: ${{ secrets.COMPANIES_YAML }}
          MODELS_YAML: ${{ secrets.MODELS_YAML }}
          PORTALS_YAML: ${{ secrets.PORTALS_YAML }}
          FEEDS_YAML: ${{ secrets.FEEDS_YAML }}
          MARKETPLACES_YAML: ${{ secrets.MARKETPLACES_YAML }}
        run: |
          python <<'PY'
          import os
          import sys
          from pathlib import Path

          files = {
              "PROFILE_YAML": "config/profile.yaml",
              "COMPANIES_YAML": "config/companies.yaml",
              "MODELS_YAML": "config/models.yaml",
              "PORTALS_YAML": "config/portals.yaml",
              "FEEDS_YAML": "config/feeds.yaml",
          }
          missing = [key for key in files if not (os.environ.get(key) or "").strip()]
          if missing:
              print(
                  "required config secrets missing: " + ", ".join(missing),
                  file=sys.stderr,
              )
              sys.exit(1)
          for key, rel in files.items():
              Path(rel).write_text(os.environ[key], encoding="utf-8")
          marketplaces = (os.environ.get("MARKETPLACES_YAML") or "").strip()
          if marketplaces:
              Path("config/marketplaces.yaml").write_text(marketplaces, encoding="utf-8")
          PY
      - name: Restore job state
        uses: actions/cache/restore@v4
        with:
          path: data/pipeline_state.db*
          key: jobdigest-state-${{ github.run_id }}
          restore-keys: |
            jobdigest-state-
      - run: python -m jobdigest collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOBDIGEST_REQUIRE_TELEGRAM: "1"
          JOBDIGEST_MARKETPLACE_PROXIES: ${{ secrets.JOBDIGEST_MARKETPLACE_PROXIES }}
      - name: Digest
        if: needs.gate.outputs.slot != 'urgent'
        run: python -m jobdigest digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOBDIGEST_REQUIRE_TELEGRAM: "1"
      - name: Urgent digest
        if: needs.gate.outputs.slot == 'urgent'
        run: python -m jobdigest digest --urgent-only
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOBDIGEST_REQUIRE_TELEGRAM: "1"
      - name: Contacts enrich
        run: python -m jobdigest contacts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBDIGEST_GITHUB_TOKEN: ${{ secrets.JOBDIGEST_GITHUB_TOKEN }}
      - name: Write Google service account
        if: needs.gate.outputs.slot != 'urgent'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python <<'PY'
          import os
          import sys
          from pathlib import Path

          raw = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON") or ""
          if not raw.strip():
              print("GOOGLE_SERVICE_ACCOUNT_JSON is required", file=sys.stderr)
              sys.exit(1)
          Path("google-sa.json").write_text(raw, encoding="utf-8")
          PY
      - name: Sheet sync
        if: needs.gate.outputs.slot != 'urgent'
        run: python -m jobdigest sheet-sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: google-sa.json
          JOBDIGEST_REQUIRE_SHEET: "1"
      - name: Checkpoint job state
        if: always()
        run: |
          python - <<'PY'
          import os, sqlite3
          path = os.environ["DATABASE_PATH"]
          if os.path.exists(path):
              sqlite3.connect(path).execute("PRAGMA wal_checkpoint(TRUNCATE)")
          PY
      - name: Save job state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/pipeline_state.db*
          key: jobdigest-state-${{ github.run_id }}-${{ github.run_attempt }}
